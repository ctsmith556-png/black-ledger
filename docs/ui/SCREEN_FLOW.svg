<text x="725.0" y="571" font-size="9.3" fill="#5a534b" text-anchor="middle">Options · Quit to Menu</text>
<rect x="640" y="672" width="300" height="52" rx="6" fill="#e7efe7" stroke="#6e1414" stroke-width="1.5"/>
<text x="790.0" y="692" font-size="12.5" fill="#1b1b1e" text-anchor="middle" font-weight="bold">UNLOCK</text>
<text x="790.0" y="709" font-size="9.3" fill="#5a534b" text-anchor="middle">the Collector joins the roster</text>
<rect x="120" y="790" width="810" height="54" rx="6" fill="#f1e3e3" stroke="#6e1414" stroke-width="1.5"/>
<text x="525.0" y="810" font-size="12.5" fill="#1b1b1e" text-anchor="middle" font-weight="bold">ENDGAME UNLOCKS</text>
<text x="525.0" y="827" font-size="9.3" fill="#5a534b" text-anchor="middle">all 15 endings → Vault</text>
<text x="525.0" y="841" font-size="9.3" fill="#5a534b" text-anchor="middle">all 10 Collectors + Auditor beaten → the Auditor playable</text>
