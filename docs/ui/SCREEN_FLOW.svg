<text x="450.0" y="723" font-size="9.3" fill="#5a534b" text-anchor="middle">final arena → Ending (~60-90s)</text>
<text x="450.0" y="737" font-size="9.3" fill="#5a534b" text-anchor="middle">else → next arena</text>
<rect x="560" y="520" width="330" height="64" rx="6" fill="#f3eee7" stroke="#9b9388" stroke-width="1.5"/>
