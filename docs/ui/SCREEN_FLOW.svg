<text x="270.0" y="345" font-size="9.3" fill="#5a534b" text-anchor="middle">route through Ashen Hollow</text>
<text x="270.0" y="359" font-size="9.3" fill="#5a534b" text-anchor="middle">next arena (gated in order)</text>
<rect x="120" y="384" width="300" height="42" rx="6" fill="#ffffff" stroke="#6e1414" stroke-width="1.5"/>
