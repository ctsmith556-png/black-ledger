<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 860" font-family="Arial, sans-serif">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8a8178"/></marker></defs>
<rect x="0" y="0" width="980" height="860" fill="#faf8f4"/>
